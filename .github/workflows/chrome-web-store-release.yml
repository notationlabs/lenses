name: Publish Chrome extension

"on":
  push:
    tags:
      - "chrome-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing extension release tag (for example, chrome-v0.4.0)"
        required: true
        type: string

concurrency:
  group: chrome-web-store-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      artifact: ${{ steps.release.outputs.artifact }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag and versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/chrome-web-store.mjs validate --tag "$RELEASE_TAG"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          node --test scripts/test/chrome-web-store.test.mjs
          pnpm test

      - name: Build from a clean extension output directory
        run: |
          rm -rf extensions/chrome/dist
          pnpm build

      - name: Create reproducible extension ZIP
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          VERSION="${RELEASE_TAG#chrome-v}"
          ARTIFACT="lenses-chrome-${VERSION}"
          ZIP="artifacts/${ARTIFACT}.zip"
          node scripts/chrome-web-store.mjs package --output "$ZIP" --version "$VERSION"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP"

      - name: Preserve release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: artifacts/${{ steps.release.outputs.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Upload and submit for review
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Download verified ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: artifacts

      - name: Authenticate as the Web Store service account
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1200s
          create_credentials_file: false

      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          VERSION: ${{ needs.verify.outputs.version }}
          ZIP: artifacts/${{ needs.verify.outputs.artifact }}.zip
        run: node scripts/chrome-web-store.mjs publish --zip "$ZIP" --version "$VERSION"
